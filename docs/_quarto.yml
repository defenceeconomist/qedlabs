project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - notes/index.qmd
    - notes/**/*.qmd
    - labs/*.qmd
    - slides/*.qmd
  pre-render:
    - python3 scripts/extract_link_graph.py --output data/notes_link_graph_payload.json --include-prefix notes/
  resources:
    - data/notes_link_graph_payload.json
    - assets/**
    - labs/notebooks/*.ipynb
    - labs/downloads/**
    - labs/data/**
    - labs/offline-setup.md
    - labs/reproducibility/**

